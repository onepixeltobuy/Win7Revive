name: Publish screenshots

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID uruchomienia Build ISO, z ktorego wziac zrzuty"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: screens-*
          path: screenshots
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Zapisz zrzuty w repozytorium
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add screenshots
          git commit -m "Add screenshots from run ${{ inputs.run_id }}"
          git push
